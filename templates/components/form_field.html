<div class="rk-field-group{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="rk-field-required">Obligatorio</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text or help %}<p class="rk-form-help" id="{{ field.auto_id }}_helptext">{% if field.help_text %}{{ field.help_text }}{% else %}{{ help }}{% endif %}</p>{% endif %}
    {% if field.errors %}<ul class="rk-form-error" id="{{ field.auto_id }}_error">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
