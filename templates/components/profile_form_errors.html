{% if form.errors %}<div class="rk-form-error-summary" role="alert"><h2>Revisa los datos</h2>{% if form.non_field_errors %}<ul>{% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}{% for field in form %}{% if field.errors %}<a href="#{{ field.id_for_label }}">{{ field.label }}: {{ field.errors|join:' ' }}</a>{% endif %}{% endfor %}</div>{% endif %}
