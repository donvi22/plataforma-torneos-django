name: Django PostgreSQL CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-postgresql:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: rankedkingdom_ci
          POSTGRES_USER: rankedkingdom_ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U rankedkingdom_ci -d rankedkingdom_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.ci_settings
      DJANGO_DEBUG: 'True'
      DJANGO_MEDIA_STORAGE: local
      TORNEO_DEMO: '0'
      CI_POSTGRES_PORT: '5432'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out code without persisting credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.10'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install verified dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
          python -m pip check
          python - <<'PYTHON'
          from importlib.metadata import version
          from pathlib import Path
          for line in Path('requirements.txt').read_text().splitlines():
              if line.strip() and not line.lstrip().startswith('#'):
                  name, expected = line.strip().split('==')
                  actual = version(name.split('[')[0])
                  if actual != expected:
                      raise SystemExit(f'Regenerate requirements-ci.lock: {name} {actual} != {expected}')
          PYTHON
      - name: Django checks
        run: python manage.py check
      - name: Detect missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Full PostgreSQL suite including concurrency
        run: python manage.py test --noinput --verbosity 2
